name: Branch Security Scanning

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: branch-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Ephemeral SonarQube SAST
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SONAR_GATE_NAME: CI Overall Code
      SONAR_HOST_URL: http://127.0.0.1:9000
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start temporary SonarQube Community server
        run: |
          set -euo pipefail
          docker run -d --name poc-sonarqube --rm \
            -p 127.0.0.1:9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community
          echo "Waiting for temporary SonarQube server..."
          ready=0
          for i in $(seq 1 90); do
            status=$(curl -fsS --max-time 5 "$SONAR_HOST_URL/api/system/status" | jq -r '.status' || true)
            if [ "$status" = "UP" ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 100 poc-sonarqube
            echo "::error::SonarQube did not become ready"
            exit 1
          fi

      - name: Generate temporary SonarQube API token
        id: auth
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 -u admin:admin \
            -X POST "$SONAR_HOST_URL/api/user_tokens/generate" \
            --data-urlencode "name=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          token=$(jq -er '.token' <<< "$response")
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Configure overall-code quality gate
        run: |
          set -euo pipefail
          sonar_post() {
            local endpoint=$1
            shift
            curl -fsS --max-time 30 -H "Authorization: Bearer $SONAR_TOKEN" \
              -X POST "$SONAR_HOST_URL/api/qualitygates/$endpoint" "$@" >/dev/null
          }
          sonar_post create --data-urlencode "name=$SONAR_GATE_NAME"
          for metric in software_quality_security_rating software_quality_reliability_rating; do
            sonar_post create_condition \
              --data-urlencode "gateName=$SONAR_GATE_NAME" \
              --data-urlencode "metric=$metric" \
              --data-urlencode "op=GT" \
              --data-urlencode "error=1"
          done
          sonar_post set_as_default --data-urlencode "name=$SONAR_GATE_NAME"

      - name: Run SonarQube SAST
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          # Analyze each checked-out revision as the temporary project's main branch.
          args: -Dsonar.projectKey=multi-tier-devops-poc

      - name: Wait for analysis and export reports
        id: quality_gate
        run: |
          set -euo pipefail
          mkdir -p reports/sonarqube
          cp .scannerwork/report-task.txt reports/sonarqube/report-task.txt
          task_url=$(sed -n 's/^ceTaskUrl=//p' .scannerwork/report-task.txt)
          if [ -z "$task_url" ]; then echo "::error::Missing SonarQube task URL"; exit 1; fi
          completed=0
          for i in $(seq 1 90); do
            curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" "$task_url" \
              -o reports/sonarqube/ce-task.json
            status=$(jq -r '.task.status' reports/sonarqube/ce-task.json)
            if [ "$status" = "SUCCESS" ]; then completed=1; break; fi
            if [ "$status" = "FAILED" ] || [ "$status" = "CANCELED" ]; then
              echo "::error::SonarQube compute task: $status"; exit 1
            fi
            sleep 5
          done
          if [ "$completed" -ne 1 ]; then echo "::error::SonarQube analysis timed out"; exit 1; fi
          analysis_id=$(jq -er '.task.analysisId' reports/sonarqube/ce-task.json)
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
            --get --data-urlencode "analysisId=$analysis_id" \
            "$SONAR_HOST_URL/api/qualitygates/project_status" \
            -o reports/sonarqube/quality-gate.json
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
            --get --data-urlencode "component=multi-tier-devops-poc" \
            --data-urlencode "metricKeys=software_quality_security_rating,software_quality_reliability_rating,security_hotspots" \
            "$SONAR_HOST_URL/api/measures/component" \
            -o reports/sonarqube/measures.json || true
          curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" \
            --get --data-urlencode "componentKeys=multi-tier-devops-poc" \
            --data-urlencode "ps=500" \
            "$SONAR_HOST_URL/api/issues/search" \
            -o reports/sonarqube/issues.json || true
          gate=$(jq -r '.projectStatus.status' reports/sonarqube/quality-gate.json)
          {
            echo "## SonarQube (temporary server)"
            echo "Quality gate: **$gate**"
            echo "Detailed JSON reports are attached as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$gate" > reports/sonarqube/quality-gate.txt
          if ! jq -e '
            .projectStatus | .status == "OK" and
            ([.conditions[] | select(.status == "OK") | .metricKey] |
              contains(["software_quality_security_rating", "software_quality_reliability_rating"]))
          ' reports/sonarqube/quality-gate.json >/dev/null; then
            echo "::error::SonarQube requires overall security and reliability ratings of A (gate: $gate)"
            exit 1
          fi

      - name: Upload SonarQube reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-reports-${{ github.run_id }}
          path: reports/sonarqube/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and remove temporary SonarQube
        if: always()
        run: docker rm -f poc-sonarqube 2>/dev/null || true

  trivy:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Scan source, dependencies, secrets, and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: reports/trivy.json
          exit-code: '0'

      - name: Generate readable Trivy report
        if: success()
        run: |
          jq -r '
            ["Target","Type","Severity","Finding"],
            (.Results[]? as $r
              | (($r.Vulnerabilities // [])[]? | [$r.Target, "Vulnerability", .Severity, .VulnerabilityID]),
                (($r.Misconfigurations // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | [$r.Target, "Misconfiguration", .Severity, .ID]),
                (($r.Secrets // [])[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | [$r.Target, "Secret", .Severity, .RuleID])
            ) | @tsv
          ' reports/trivy.json > reports/trivy.tsv

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce HIGH and CRITICAL security gate
        if: success()
        run: |
          count=$(jq '[.Results[]? |
            ((.Vulnerabilities // []) | map(select(.Severity == "HIGH" or .Severity == "CRITICAL")) | length)
            + ((.Misconfigurations // []) | map(select(.Severity == "HIGH" or .Severity == "CRITICAL")) | length)
            + ((.Secrets // []) | map(select(.Severity == "HIGH" or .Severity == "CRITICAL")) | length)
          ] | add // 0' reports/trivy.json)
          {
            echo '## Trivy security scan'
            echo "HIGH/CRITICAL findings: **$count**"
            echo 'Download the Trivy JSON/TSV reports from workflow artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy detected $count HIGH/CRITICAL findings."
            exit 1
          fi

  image_scan:
    name: Build and scan ${{ matrix.image }} image
    needs: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      IMAGE_NAME: ci/${{ matrix.image }}:${{ github.sha }}
      APP: ${{ matrix.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build application image
        run: |
          set -euo pipefail
          build_args=()
          if [ "$APP" = "frontend" ]; then
            build_args+=(--build-arg VITE_API_URL=/api)
          fi
          docker build "${build_args[@]}" --tag "$IMAGE_NAME" "./$APP"

      - name: Scan application image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: '1'

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.image }}-${{ github.run_id }}
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 14

  security_gate:
    name: Security Gate
    if: always()
    needs: [sonarqube, trivy, image_scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SONAR_RESULT: ${{ needs.sonarqube.result }}
      FILESYSTEM_RESULT: ${{ needs.trivy.result }}
      IMAGE_RESULT: ${{ needs.image_scan.result }}
    steps:
      - name: Require all scans to pass
        run: |
          printf 'SonarQube: %s\nTrivy filesystem: %s\nTrivy images: %s\n' \
            "$SONAR_RESULT" "$FILESYSTEM_RESULT" "$IMAGE_RESULT"
          if [[ "$SONAR_RESULT" != success || "$FILESYSTEM_RESULT" != success || "$IMAGE_RESULT" != success ]]; then
            echo "::error::SonarQube and all Trivy scans must pass"
            exit 1
          fi
