
server {
    # Listen for HTTP requests on port 80
    listen 80;

    # Accept requests for any hostname
    server_name _;

    # Directory containing the React production build
    root /usr/share/nginx/html;

    # Default page served by Nginx
    index index.html;

    # Serve static files or fall back to React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

